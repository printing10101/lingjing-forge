# =============================================================================
# 灵境制造 - CNC后处理器配置文件
# =============================================================================
# 采用分控制器配置模式：
#   - base：所有控制器通用参数（可被控制器特定配置覆盖）
#   - controllers.<name>：各控制器差异化配置（优先级高于 base）
# =============================================================================

# ---------------------------------------------------------------------------
# 目标控制器选择
# ---------------------------------------------------------------------------
target_controller: fanuc_0i

# =============================================================================
# 基础配置段（所有控制器通用参数）
# =============================================================================
base:

  # --- 输出精度控制 ---
  decimal_places: 3

  # --- 加工安全参数 ---
  safe_z_height: 50.0

  # --- 快速进给 ---
  rapid_feed: 10000

  # =========================================================================
  # 主轴转速限制
  # =========================================================================
  spindle:
    min_rpm: 50
    max_rpm: 24000
    default_rpm: 8000

  # =========================================================================
  # 进给速度限制
  # =========================================================================
  feed:
    min_rate: 10.0
    max_rate: 20000.0
    default_rate: 1000.0

  # =========================================================================
  # 工件坐标系配置 (G54-G59)
  # =========================================================================
  work_coordinate:
    G54:
      x_offset: 0.0
      y_offset: 0.0
      z_offset: 0.0
      enabled: true
    G55:
      x_offset: 0.0
      y_offset: 0.0
      z_offset: 0.0
      enabled: false
    G56:
      x_offset: 0.0
      y_offset: 0.0
      z_offset: 0.0
      enabled: false
    G57:
      x_offset: 0.0
      y_offset: 0.0
      z_offset: 0.0
      enabled: false
    G58:
      x_offset: 0.0
      y_offset: 0.0
      z_offset: 0.0
      enabled: false
    G59:
      x_offset: 0.0
      y_offset: 0.0
      z_offset: 0.0
      enabled: false
    default_coordinate_system: G54

  # =========================================================================
  # 刀具补偿寄存器配置
  # =========================================================================
  tool_offset:
    length_registers:
      start: 1
      end: 400
      default_offset: 0.0

    radius_registers:
      start: 1
      end: 400
      default_offset: 0.0

      compensation_types:
        G41:
          description: "刀具半径左补偿"
          register_range: [1, 199]
        G42:
          description: "刀具半径右补偿"
          register_range: [200, 400]

  # =========================================================================
  # 固定循环配置
  # =========================================================================
  fixed_cycles:

    # --- 钻孔循环 ---
    drilling:
      G81:
        description: "简单钻孔循环（无暂停，快速退刀）"
        retract_mode: "G98"       # G98: 退刀至初始平面, G99: 退刀至R平面
        peck_depth: 2.0           # 每次啄钻深度 (mm)
        retract_distance: 1.0     # 退刀距离 (mm)
      G83:
        description: "深孔啄钻循环（带暂停）"
        retract_mode: "G98"
        peck_depth: 5.0           # 每次啄钻深度 (mm)
        retract_distance: 1.0     # 退刀距离 (mm)
        dwell_time: 0.1           # 孔底暂停时间 (s)
        decrement_type: "constant"  # constant / variable

    # --- 攻丝循环 ---
    tapping:
      G84:
        description: "右旋攻丝循环"
        spindle_direction: "M03"  # M03: 正转, M04: 反转
        feed_per_rev: true        # true: 每转进给, false: 每分钟进给
        dwell_time: 0.0           # 孔底暂停时间 (s)
        retract_spindle_direction: "M04"  # 退刀时主轴转向

    # --- 镗孔循环 ---
    boring:
      G86:
        description: "粗镗孔循环（主轴停止，快速退刀）"
        retract_mode: "G98"
        dwell_time: 0.5           # 孔底暂停时间 (s)
        retract_type: "rapid"     # rapid / feed
        orient_spindle: false     # 主轴定向停止
        shift_axis: null          # 退刀偏移轴 (null/X/Y)
        shift_distance: 0.0       # 退刀偏移距离 (mm)
      G89:
        description: "精镗孔循环（进给退刀）"
        retract_mode: "G99"
        dwell_time: 1.0           # 孔底暂停时间 (s)
        retract_type: "feed"      # rapid / feed
        orient_spindle: false
        shift_axis: null
        shift_distance: 0.0

    # --- 螺纹加工循环 ---
    threading:
      G76:
        description: "精镗孔/背镗循环（可配置为螺纹加工）"
        retract_mode: "G99"
        lead: 1.0                 # 螺纹导程 (mm)
        passes: 5                 # 切削次数
        depth_cut_first: 0.2      # 第一次切削深度 (mm)
        depth_cut_last: 0.05      # 最后一次切削深度 (mm)
        finishing_passes: 2       # 精加工次数
        taper: 0.0                # 锥度角 (度)
        tool_angle: 60.0          # 刀尖角度 (度)
        retract_type: "oriented"  # oriented / rapid / feed
        shift_axis: "X"           # 退刀偏移轴
        shift_distance: 0.1       # 退刀偏移距离 (mm)
        infeed_method: "compound"  # compound (复合进给) / radial (径向进给) / flank (单侧进给)

  # =========================================================================
  # 子程序/宏程序支持
  # =========================================================================
  subprogram:
    call_format: "M98 P{program_num:04d} L{repeat}"
    end_code: "M99"
    program_number:
      minimum: 1
      maximum: 9999
      format: "{:04d}"
    repeat:
      default: 1
      minimum: 1
      maximum: 9999

    macro_variables:
      local:
        range: [1, 33]
        description: "局部变量（调用时传递，调用后清除）"
      common:
        range: [100, 199]
        description: "公共变量（模态保持，断电保护可选）"
      system:
        range: [1000, 1999]
        description: "系统变量（只读，反映系统状态）"

