# ============================================================
# 灵境制造 - Kubernetes Secret 清单模板（示例占位符）
# ============================================================
# 用途：
#   deploy/k8s/deployment.yml 引用 lnn-secrets 中的 redis-url 和 db-url 两个 key，
#   但此前缺少 Secret 清单模板，运维容易遗漏创建，导致 Pod 因 secretKeyRef 找不到
#   Secret 而进入 CrashLoopBackOff。
#
# 使用方法（二选一）：
#
#   方式一（推荐，kubectl create secret，避免明文 base64 进入仓库）：
#     kubectl create secret generic lnn-secrets \
#       --namespace=<your-namespace> \
#       --from-literal=redis-url='redis://:password@redis-host:6379/0' \
#       --from-literal=db-url='postgresql+asyncpg://user:password@db-host:5432/lingjing'
#
#   方式二（kubectl apply 本文件，需先填充真实 base64 值）：
#     # 生成 base64 值（注意：不要使用 echo -n 之外的换行，否则 base64 会包含换行符）
#     echo -n 'redis://:password@redis-host:6379/0' | base64
#     echo -n 'postgresql+asyncpg://user:password@db-host:5432/lingjing' | base64
#     # 将上方命令的输出填入下方 data 对应字段，然后执行：
#     kubectl apply -f deploy/k8s/secret.example.yml -n <your-namespace>
#
# 安全注意：
#   - 切勿将包含真实凭据的 Secret 清单提交到版本控制
#   - 建议将本文件保持为 .example 后缀，真实 secret 通过 kubectl create secret 创建
#   - 如需 GitOps 管理，请配合 Sealed Secrets / SOPS / External Secrets 等加密方案
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: lnn-secrets
  labels:
    app: lnn-api
type: Opaque
stringData:
  # 使用 stringData 可直接写明文，kubectl apply 时会自动 base64 编码。
  # 请将下方占位符替换为真实连接字符串。
  # redis-url: Redis 连接串，格式 redis://[:password@]host:port/db
  redis-url: "redis://:CHANGE_ME@redis-host:6379/0"
  # db-url: 数据库连接串，SQLite 单机部署无需此 Secret（由 docker-compose-sqlite.yml 注入）。
  # K8s 部署推荐 PostgreSQL，格式 postgresql+asyncpg://user:password@host:port/dbname
  db-url: "postgresql+asyncpg://user:CHANGE_ME@db-host:5432/lingjing"
