# HorizontalPodAutoscaler - 基于 CPU/内存自动扩缩
# 当 CPU 利用率超过 70% 或内存利用率超过 80% 时自动扩容
# 最小 3 副本（与 Deployment.spec.replicas 一致），最大 10 副本
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lnn-api-hpa
  labels:
    app: lnn-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lnn-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Min
