# Nginx 反向代理配置 - TLS/HTTPS 强制
# 用于生产环境强制 HTTPS 并代理到后端 API
# 注意：本文件通过 docker-compose 挂载为 /etc/nginx/conf.d/default.conf，
#       由主 nginx.conf 的 http 块 include，因此 upstream/limit_req_zone 等
#       http 上下文指令可直接在文件顶层使用。

upstream lnn_api_backend {
    server lnn-api:8765;
}

# 速率限制区域定义（http 上下文，必须在 server 块外）
# 每个客户端 IP 每秒 10 个请求，突发 20 个
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 登录/注册端点更严格限制：每秒 5 个请求，突发 10 个
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 强制重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS 证书路径（通过 Docker volumes 挂载）
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 安全配置 - 仅允许 TLS 1.2 和 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;  # 由服务器选择加密套件（Mozilla 现代配置推荐）

    # SSL 会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS - 强制浏览器使用 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection 已被现代浏览器废弃，CSP 提供更全面的 XSS 防护
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # CSP - 防御 XSS 与数据注入
    # Vue3+Vite 编译期处理模板，无需 script-src 'unsafe-inline'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    # Permissions-Policy - 限制浏览器 API 访问
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # X-Permitted-Cross-Domain-Policies - 禁止 Adobe 跨域读取
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # 请求体大小限制（防止大文件上传攻击，默认 1m 不足以上传模型/图纸）
    # 后端 LNN 模型文件、DXF 图纸等可能较大，按需调整
    client_max_body_size 50m;
    client_body_buffer_size 256k;

    # 请求体缓冲（大于缓冲区时写入临时文件，避免内存暴涨）
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Gzip 压缩配置（减少带宽消耗，加速首屏渲染）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/wasm;
    gzip_proxied any;
    gzip_disable "MSIE [1-6]\.";

    # 反向代理到后端 API
    location / {
        # 速率限制：突发请求缓冲，超限返回 429
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://lnn_api_backend;
        proxy_http_version 1.1;

        # 保持连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 传递真实客户端信息
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 健康检查端点（不记录日志，不限流）
    location /api/health {
        proxy_pass http://lnn_api_backend;
        access_log off;
    }

    # 认证端点（更严格的速率限制，防止暴力破解）
    location ~ ^/api/v1/auth/(login|register|refresh|reset-password)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://lnn_api_backend;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # WebSocket 支持（不压缩，避免干扰协议升级）
    location /ws {
        proxy_pass http://lnn_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时（默认 60s 会断开长连接）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态文件缓存
    # 注意: Nginx 的 add_header 在 location 块内会覆盖 server 级别的 add_header，
    # 因此必须在此显式复制所有安全头。
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://lnn_api_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 安全头 (从 server 级别复制，避免 add_header 覆盖陷阱)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
