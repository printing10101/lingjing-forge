# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: "LNN Default"
    orgId: 1
    folder: "LNN"
    folderUid: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
