[workspace]
members = ["crates/core", "crates/pyo3_bindings"]
resolver = "2"

[workspace.package]
version = "2.8.0"
edition = "2021"
rust-version = "1.70"
authors = ["Lingjing Manufacturing Team"]
license = "Apache-2.0"
repository = "https://github.com/printing10101/Virtual-Realm-Manufacturing"

[workspace.dependencies]
# 内部 crate
compute-core = { path = "crates/core", version = "2.8.0" }

# 第三方依赖
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
numpy = "0.22"
ndarray = "0.15"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
parking_lot = "0.12"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }

# 性能分析（仅在 bench/test 中使用，由 crates/core 的 [dev-dependencies] 引入）
# 注意：workspace 依赖不允许写 optional（cargo 会直接报
# "criterion is optional, but workspace dependencies cannot be optional"
# 并导致整个 workspace 无法解析），optional 只能声明在成员 crate 上。
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true

[profile.bench]
opt-level = 3
lto = "thin"
debug = true
