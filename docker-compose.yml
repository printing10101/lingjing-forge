# ============================================================
# 灵境制造（上线版） Docker Compose 配置
# ============================================================
# 使用说明：
#   1. 复制环境变量模板文件：
#        Linux / macOS :  cp .env.example .env
#        Windows (PS)  :  Copy-Item .env.example .env
#   2. 在项目根目录的 .env 中填入真实的密码、密钥等敏感值
#      （.env 文件已被 .gitignore 忽略，不会被提交到 Git 仓库）
#   3. 配置镜像源（可选）：
#        国内用户可在 .env 中设置 IMAGE_REGISTRY 加速镜像拉取：
#        - 阿里云：IMAGE_REGISTRY=registry.cn-hangzhou.aliyuncs.com
#        - 华为云：IMAGE_REGISTRY=swr.cn-north-4.myhuaweicloud.com
#        - 默认值：留空使用 Docker Hub 官方源
#   4. 启动服务：
#        docker compose --profile full up -d     # 启动完整服务栈
#        docker compose --profile api up -d      # 仅启动 API
#        docker compose --profile monitoring up -d   # 仅启动监控栈
#   5. 验证配置：
#        docker compose config                   # 检查配置正确性
#
# 安全说明：
#   - 所有密码、密钥均通过 ${VAR_NAME} 形式从 .env 注入，不在本文件中硬编码
#   - Redis（6379）与 PostgreSQL（5432）不再对外暴露端口，仅容器网络内部通信
#   - 安全修复 [B36]：API（8765）、Grafana（3000）、Prometheus（9090）端口
#     绑定至 127.0.0.1，仅本地访问；生产环境应通过 nginx 反向代理对外暴露
# ============================================================

name: lnn-manufacturing

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  lnn-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: lnn-api
    # 安全修复 [B36]：端口绑定至 127.0.0.1，仅本地访问；
    # 生产环境应通过 nginx 反向代理对外暴露，避免直接对外暴露 API 端口
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PORT=${PORT:-8765}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - TDENGINE_HOST=lnn-tdengine
      - TDENGINE_PORT=6041
      - TDENGINE_USER=${TDENGINE_USER:-lnn_app}  # 不建议使用 root，请在 .env 中显式设置
      - TDENGINE_PASSWORD=${TDENGINE_PASSWORD:?TDENGINE_PASSWORD must be set in .env file}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      # OPC UA 配置（工厂环境）
      - OPCUA_ENDPOINT=${OPCUA_ENDPOINT:-opc.tcp://localhost:4840}
      - OPCUA_TIMEOUT=${OPCUA_TIMEOUT:-10.0}
      - OPCUA_INTERVAL=${OPCUA_INTERVAL:-1.0}
    volumes:
      - ./models/lnn:/app/models/lnn
      - ./logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      lnn-tdengine:
        condition: service_healthy
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "api"]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8765/api/health/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

  redis:
    image: ${IMAGE_REGISTRY:-docker.io}/library/redis:7.4.2-alpine
    container_name: lnn-redis
    # Redis 仅通过容器网络 lnn-network 内部通信，不对外暴露端口
    # 安全修复：强制启用 requirepass，密码从 .env 注入，禁止无密码访问
    environment:
      # 安全修复：使用 ${VAR:?error} required 语法，未设置环境变量时拒绝启动
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    networks:
      - lnn-network
    restart: unless-stopped
    command: >
      sh -c "redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass \"$${REDIS_PASSWORD}\""
    logging: *default-logging
    healthcheck:
      # 使用 REDISCLI_AUTH 环境变量代替 -a 参数，避免密码出现在进程列表中
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

  postgres:
    image: ${IMAGE_REGISTRY:-docker.io}/library/postgres:15.10-alpine
    container_name: lnn-postgres
    # PostgreSQL 仅通过容器网络 lnn-network 内部通信，不对外暴露端口
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      # 安全修复：使用 ${VAR:?error} required 语法，未设置环境变量时拒绝启动
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lnn-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  lnn-tdengine:
    # TDengine 时序数据库 - 用于机床高频传感器数据存储
    image: ${IMAGE_REGISTRY:-docker.io}/tdengine/tdengine:3.0.7.5
    container_name: lnn-tdengine
    hostname: lnn-tdengine
    # 仅通过容器网络 lnn-network 内部通信，不对外暴露端口
    # 如需调试可临时取消注释:
    #   - "6030:6030"  # native protocol
    #   - "6041:6041"  # REST API
    #   - "6043:6043"  # WebSocket
    environment:
      - TAOS_FQDN=lnn-tdengine
      # 首次启动自动创建 root 用户密码（生产环境请通过 .env 覆盖）
      - TAOS_FIRST_EP=lnn-tdengine
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - lnn-tdengine-data:/var/lib/taos
      - lnn-tdengine-cfg:/etc/taos
      - ./deploy/tdengine/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lnn-network
    restart: unless-stopped
    # TDengine 容器初始化通常需要 10-30 秒（节点注册 + 集群发现）
    logging: *default-logging
    healthcheck:
      # 双重验证：taos CLI 检测数据库 + HTTP /api/health 端点检测 REST 服务
      test: ["CMD-SHELL", "taos -s 'show databases;' >/dev/null 2>&1 && curl -fsS http://localhost:6041/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 512M

  prometheus:
    image: ${IMAGE_REGISTRY:-docker.io}/prom/prometheus:v2.55.0
    container_name: lnn-prometheus
    # 安全修复 [B36]：端口绑定至 127.0.0.1，仅本地访问；
    # 生产环境应通过 nginx 反向代理对外暴露，避免直接对外暴露监控面板
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

  grafana:
    image: ${IMAGE_REGISTRY:-docker.io}/grafana/grafana:11.3.0
    container_name: lnn-grafana
    # 安全修复 [B36]：端口绑定至 127.0.0.1，仅本地访问；
    # 生产环境应通过 nginx 反向代理对外暴露，避免直接对外暴露可视化面板
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      # 安全修复：使用 ${VAR:?error} required 语法，未设置环境变量时拒绝启动
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  nginx:
    # P3-DEV-5 修复：固定 nginx 版本为 1.27.3-alpine，避免使用滚动标签 alpine
    # 与 prometheus/grafana 一致采用版本固定策略，保证供应链可追溯
    image: ${IMAGE_REGISTRY:-docker.io}/library/nginx:1.27.3-alpine
    container_name: lnn-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      # P0-15 修复：挂载自签名证书生成脚本，让容器启动时自动检测证书缺失
      - ./deploy/nginx/generate_dev_cert.sh:/docker-entrypoint.d/40-generate-dev-cert.sh:ro
    depends_on:
      lnn-api:
        condition: service_healthy
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "api"]
    logging: *default-logging
    # P0-15 修复：证书缺失时 nginx 会因找不到 fullchain.pem 启动失败。
    # 这里通过 entrypoint 在 nginx 启动前检测证书，缺失时自动生成自签名证书（仅开发环境）。
    # 生产环境请提前在宿主机运行：sh deploy/nginx/generate_dev_cert.sh（或放置真实证书）
    entrypoint: >
      sh -c "if [ ! -f /etc/nginx/certs/fullchain.pem ] || [ ! -f /etc/nginx/certs/privkey.pem ]; then
               echo '[nginx] WARNING: TLS 证书缺失，正在生成自签名证书（仅开发环境，浏览器会显示安全警告）';
               echo '[nginx] 生产环境请按 deploy/nginx/README_TLS.md 放置真实证书';
               mkdir -p /etc/nginx/certs &&
               openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                 -keyout /etc/nginx/certs/privkey.pem \
                 -out /etc/nginx/certs/fullchain.pem \
                 -subj '/C=CN/ST=Beijing/L=Beijing/O=Lingjing-Dev/CN=localhost' 2>/dev/null;
               chmod 644 /etc/nginx/certs/fullchain.pem;
               chmod 600 /etc/nginx/certs/privkey.pem;
             fi;
             /docker-entrypoint.sh nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M

  postgres-backup:
    image: ${IMAGE_REGISTRY:-docker.io}/library/postgres:15.10-alpine
    container_name: lnn-postgres-backup
    # 注意：postgres-backup 必须以 root 运行，因为：
    # 1) crond 守护进程需要 root 权限读取 /etc/crontabs/root
    # 2) pg_dump 需要通过 .pgpass 访问 postgres 容器
    # 安全补偿：容器仅启动 crond + pg_dump，不暴露端口，无交互 shell
    user: root
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      # 安全修复：使用 ${VAR:?error} required 语法，未设置环境变量时拒绝启动
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./scripts/backup_postgres.sh:/backup_postgres.sh:ro
      - postgres-backups:/backups
    networks:
      - lnn-network
    depends_on:
      postgres:
        condition: service_healthy
    # 每天凌晨 2 点执行备份
    entrypoint: >
      sh -c "echo '0 2 * * * /backup_postgres.sh >> /var/log/backup.log 2>&1' > /etc/crontabs/root &&
             crond -f -l 8"
    restart: unless-stopped
    profiles: ["full"]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null && find /backups -name '*.sql.gz' -mmin -1440 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

volumes:
  redis-data:
  postgres-data:
  postgres-backups:
  lnn-tdengine-data:
  lnn-tdengine-cfg:
  prometheus-data:
  grafana-data:

networks:
  lnn-network:
    driver: bridge
