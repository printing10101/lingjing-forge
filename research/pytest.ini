[pytest]
# 科研侧独立配置。cwd=research 时本文件优先于仓库根 pytest.ini（rootdir 收敛到 research/）。
#
# 为什么需要这一层：
#   tests/test_model_benchmark.py 的 TestModelBenchmark 四个用例在 CPU 上以
#   epochs=50 跑 Uniwear 全量训练。CFC 约 1 分钟可过，但 LTC 的 ODE 积分在同等
#   数据量下没有收敛上界，2026-11-11 实测单文件 >300s 未完成（1 项通过、6 项未执行）。
#   这些用例本身是"模型精度基准"，不是回归门禁，不应阻塞日常测试。
#
# 用法：
#   pytest tests/                  → 跳过 benchmark（默认，约 12 分钟可跑完）
#   pytest tests/ -m benchmark     → 只跑基准（慢，手动触发，建议留足 30 分钟）
#   pytest tests/ -m "not benchmark and not gpu"  → 更窄的子集
#
# 注意：addopts 里的 -m 会被命令行同名参数覆盖，所以 `-m benchmark` 能正常选中。

addopts = --strict-markers -m "not benchmark"

markers =
    benchmark: 全量模型精度基准（CPU 上 epochs=50 训练，慢，默认不收集）
