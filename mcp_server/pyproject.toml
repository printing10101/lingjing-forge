[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lingjing-mcp"
version = "2.8.0"
description = "MCP server for 灵境制造 Agent Gateway"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.26.0",
]

[project.scripts]
lingjing-mcp = "mcp_server.server:main"
