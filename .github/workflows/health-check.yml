name: "灵境制造 · 每日仓库健康巡检"

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 仓库健康巡检
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "# 灵境制造 · 仓库健康巡检报告" > health-report.md
          echo "**巡检时间**: $(date '+%Y-%m-%d %H:%M UTC')" >> health-report.md
          echo "" >> health-report.md

          echo "## 1. Issue 状态" >> health-report.md
          echo "" >> health-report.md
          gh issue list --repo ${{ github.repository }} --state open --limit 50 --json number,title,labels,createdAt,updatedAt,comments --jq '
            "| # | 标题 | 标签 | 创建时间 | 评论数 |",
            "|---|---|---|---|---|",
            (.[] | "| \(.number) | \(.title) | \(.labels | map(.name) | join(", ")) | \(.createdAt) | \(.comments | length) |")
          ' >> health-report.md
          echo "" >> health-report.md

          echo "## 2. Pull Request 状态" >> health-report.md
          echo "" >> health-report.md
          gh pr list --repo ${{ github.repository }} --state open --limit 50 --json number,title,createdAt,updatedAt,labels --jq '
            "| # | 标题 | 创建时间 | 更新时间 | 标签 |",
            "|---|---|---|---|---|",
            (.[] | "| \(.number) | \(.title) | \(.createdAt) | \(.updatedAt) | \(.labels | map(.name) | join(", ")) |")
          ' >> health-report.md
          echo "" >> health-report.md

          echo "## 3. 最近提交" >> health-report.md
          echo "" >> health-report.md
          gh api repos/${{ github.repository }}/commits?per_page=10 --jq '.[] | "- \(.commit.author.name): \(.commit.message | split("\n")[0]) (\(.commit.author.date))"' >> health-report.md
          echo "" >> health-report.md

          echo "## 4. 工作流执行状态" >> health-report.md
          echo "" >> health-report.md
          gh run list --repo ${{ github.repository }} --limit 5 --json name,status,conclusion,createdAt --jq '
            "| 名称 | 状态 | 结论 | 时间 |",
            "|---|---|---|---|",
            (.[] | "| \(.name) | \(.status) | \(.conclusion) | \(.createdAt) |")
          ' >> health-report.md
          echo "" >> health-report.md

          echo "## 5. 分支状态" >> health-report.md
          echo "" >> health-report.md
          gh api repos/${{ github.repository }}/branches?per_page=20 --jq '.[] | "- \(.name): \(.commit.sha[0:7])"' >> health-report.md

          cat health-report.md