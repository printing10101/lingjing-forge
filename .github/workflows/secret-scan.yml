# Secret扫描安全配置工作流
# 用于在CI/CD流程中自动检测和报告敏感信息泄露

name: Secret Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # 支持手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 安全修复：最小权限原则，默认仅授予只读权限
permissions:
  contents: read

env:
  TRUFFLEHOG_VERSION: '3.88.18'  # 固定版本，确保扫描结果可复现
  SCAN_DEPTH: 'full'

jobs:
  # ============================================
  # Job 1: 使用TruffleHog进行Secret扫描
  # ============================================
  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 安全修复：此 job 需要创建 Issue，覆盖默认只读权限
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以扫描所有提交

      - name: Run TruffleHog (scan entire repository)
        id: trufflehog
        # CI-F2 修复：移除 continue-on-error，让扫描失败正确传播到 Job result。
        # 命令末尾的 `|| true` 已保证工具退出码不会中断扫描步骤；
        # 真正的失败判定交给后续 "Fail on critical findings" 步骤基于 total_issues 做出。
        run: |
          echo "========================================"
          echo "  TruffleHog Secret Scan"
          echo "========================================"
          echo ""
          echo "扫描范围: 整个仓库"
          echo "扫描模式: ${{ env.SCAN_DEPTH }}"
          echo ""
          
          # 安装并运行TruffleHog
          docker run --rm -v .:/src \
            trufflesecurity/trufflehog:${{ env.TRUFFLEHOG_VERSION }} \
            filesystem /src \
            --json \
            --no-update \
            > trufflehog-results.json 2>&1 || true
          
          # 检查结果
          if [ -s trufflehog-results.json ]; then
            echo "发现潜在的敏感信息:"
            cat trufflehog-results.json | jq -r 'select(.SourceMetadata != null) | "\(.DetectorName): \(.SourceMetadata.Data.file)"' || true
            echo ""
            echo "详细结果已保存到 trufflehog-results.json"
          else
            echo "未发现敏感信息泄露"
          fi

      - name: Analyze TruffleHog results
        id: analyze
        run: |
          echo "========================================"
          echo "  分析扫描结果"
          echo "========================================"
          
          if [ -f trufflehog-results.json ] && [ -s trufflehog-results.json ]; then
            # 统计发现的问题数量
            # 注意不能用 jq -s 'length'：-s 会把整个输入包成单元素数组，
            # 空结果 [] 会被误计为 1（2026-09-05 修复）
            TOTAL_ISSUES=$(cat trufflehog-results.json | jq 'length' 2>/dev/null || echo "0")
            echo "total_issues=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
            
            if [ "$TOTAL_ISSUES" -gt 0 ]; then
              echo "发现 $TOTAL_ISSUES 个潜在的敏感信息泄露"
              echo ""
              
              # 按检测器类型分类
              echo "按类型分类:"
              cat trufflehog-results.json | jq -r '.DetectorName' | sort | uniq -c | sort -rn || true
              echo ""
              
              # 生成详细报告
              echo "## Secret扫描发现" > secret-scan-report.md
              echo "" >> secret-scan-report.md
              echo "**扫描时间**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> secret-scan-report.md
              echo "**发现问题数**: $TOTAL_ISSUES" >> secret-scan-report.md
              echo "" >> secret-scan-report.md
              echo "### 详细发现" >> secret-scan-report.md
              echo "" >> secret-scan-report.md
              
              # 添加每个发现的详细信息
              cat trufflehog-results.json | jq -r '
                "#### " + .DetectorName + "\n" +
                "- **文件**: " + (.SourceMetadata.Data.file // "N/A") + "\n" +
                "- **行号**: " + (.SourceMetadata.Data.line | tostring // "N/A") + "\n" +
                "- **验证状态**: " + (if .Verified then "已验证" else "未验证" end) + "\n" +
                "- **描述**: " + (.Description // "N/A") + "\n"
              ' >> secret-scan-report.md 2>/dev/null || true
              
              echo "报告已生成: secret-scan-report.md"
            fi
          else
            echo "total_issues=0" >> $GITHUB_OUTPUT
            echo "未发现敏感信息泄露"
          fi

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-scan-results
          path: |
            trufflehog-results.json
            secret-scan-report.md
          retention-days: 90

      - name: Create GitHub Issue on findings
        if: steps.analyze.outputs.total_issues != '0' && steps.analyze.outputs.total_issues != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Secret扫描发现敏感信息\n\n';
            body += '**扫描时间**: ' + new Date().toISOString() + '\n';
            body += '**发现问题数**: ' + '${{ steps.analyze.outputs.total_issues }}' + '\n\n';
            
            try {
              if (fs.existsSync('secret-scan-report.md')) {
                const report = fs.readFileSync('secret-scan-report.md', 'utf8');
                body += report;
              }
            } catch(e) {
              body += '无法读取详细报告\n';
            }
            
            body += '\n### 建议操作\n';
            body += '1. 立即审查发现的文件\n';
            body += '2. 从代码中移除所有敏感信息\n';
            body += '3. 使用环境变量或密钥管理服务\n';
            body += '4. 如果密钥已泄露，立即轮换\n';
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Security] Secret扫描发现敏感信息泄露',
              body: body,
              labels: ['security', 'secret-scan', 'high-priority']
            });

      - name: Fail on critical findings
        if: steps.analyze.outputs.total_issues != '0' && steps.analyze.outputs.total_issues != ''
        run: |
          echo "========================================"
          echo "  扫描失败: 发现敏感信息泄露"
          echo "========================================"
          echo ""
          echo "发现 ${{ steps.analyze.outputs.total_issues }} 个潜在的敏感信息泄露"
          echo "请查看详细的扫描结果并立即修复"
          echo ""
          exit 1

  # ============================================
  # Job 2: 使用Gitleaks进行补充扫描
  # ============================================
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        # CI-F2 修复：移除 continue-on-error，让扫描失败正确传播到 Job result。
        # 命令末尾的 `|| true` 已保证工具退出码不会中断扫描步骤；
        # 真正的失败判定交给后续 "Fail on critical findings" 步骤基于 total_findings 做出。
        run: |
          echo "========================================"
          echo "  Gitleaks Secret Scan"
          echo "========================================"

          # 下载并运行Gitleaks（固定版本 + SHA256 校验）
          # [2026-09-05 修复] gitleaks 发行包命名为 linux_x64（无 linux_amd64），
          # 原 URL 实为 404、grep 结果为空导致校验必挂；改为精确文件名匹配。
          GITLEAKS_VERSION="8.24.0"
          GITLEAKS_TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_TARBALL}" -o gitleaks.tar.gz
          curl -sSL --fail "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          EXPECTED_HASH=$(grep "${GITLEAKS_TARBALL}" checksums.txt | awk '{print $1}')
          ACTUAL_HASH=$(sha256sum gitleaks.tar.gz | awk '{print $1}')
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "Gitleaks SHA256 校验失败！"
            echo "期望: $EXPECTED_HASH"
            echo "实际: $ACTUAL_HASH"
            exit 1
          fi
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

          ./gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-results.json \
            --verbose \
            --no-git || true

          if [ -s gitleaks-results.json ]; then
            echo "发现潜在的敏感信息:"
            cat gitleaks-results.json | jq -r '.[] | "\(.Rule): \(.File):\(.StartLine)"' || true
          else
            echo "未发现敏感信息泄露"
          fi

      - name: Analyze Gitleaks results
        id: gitleaks-analyze
        run: |
          if [ -f gitleaks-results.json ] && [ -s gitleaks-results.json ]; then
            # 不能用 jq -s 'length'：-s 把整个输入包成单元素数组，空数组 []
            # 会被误计为 1（2026-09-05 修复）
            TOTAL=$(cat gitleaks-results.json | jq 'length' 2>/dev/null || echo "0")
            echo "total_findings=$TOTAL" >> $GITHUB_OUTPUT

            if [ "$TOTAL" -gt 0 ]; then
              echo "Gitleaks发现 $TOTAL 个问题"

              # 生成报告
              echo "## Gitleaks扫描报告" > gitleaks-report.md
              echo "" >> gitleaks-report.md
              echo "**扫描时间**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> gitleaks-report.md
              echo "**发现问题数**: $TOTAL" >> gitleaks-report.md
              echo "" >> gitleaks-report.md

              cat gitleaks-results.json | jq -r '
                .[] | "### " + .Rule + "\n" +
                "- **文件**: " + .File + "\n" +
                "- **行号**: " + (.StartLine | tostring) + "\n" +
                "- **提交**: " + (.Commit // "N/A") + "\n" +
                "- **作者**: " + (.Author // "N/A") + "\n" +
                "- **验证状态**: " + (if .Verified then "已验证" else "未验证" end) + "\n"
              ' >> gitleaks-report.md 2>/dev/null || true
            fi
          else
            echo "total_findings=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Gitleaks results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-scan-results
          path: |
            gitleaks-results.json
            gitleaks-report.md
          retention-days: 90

      - name: Fail on critical findings
        # CI-F2 修复：补齐 Gitleaks 缺失的失败检查步骤，与 TruffleHog Job 行为对齐。
        # 之前 Gitleaks 即使发现 secrets 也不会失败，导致 scan-summary 的 result 检查形同虚设。
        if: steps.gitleaks-analyze.outputs.total_findings != '0' && steps.gitleaks-analyze.outputs.total_findings != ''
        run: |
          echo "========================================"
          echo "  扫描失败: Gitleaks 发现敏感信息泄露"
          echo "========================================"
          echo ""
          echo "发现 ${{ steps.gitleaks-analyze.outputs.total_findings }} 个潜在的敏感信息泄露"
          echo "请查看详细的扫描结果并立即修复"
          echo ""
          exit 1

  # ============================================
  # Job 3: 扫描结果汇总
  # ============================================
  scan-summary:
    name: Secret Scan Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [trufflehog-scan, gitleaks-scan]
    if: always()

    steps:
      - name: Download all scan results
        uses: actions/download-artifact@v4
        with:
          path: scan-results

      - name: Generate summary report
        run: |
          echo "## Secret扫描总结报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 扫描工具 | 状态 | 发现问题数 |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | ${{ needs.trufflehog-scan.result }} | 见详细报告 |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks-scan.result }} | 见详细报告 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 扫描详情" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **扫描时间**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "- **扫描范围**: 整个仓库" >> $GITHUB_STEP_SUMMARY
          echo "- **扫描模式**: 完整历史扫描" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 建议操作" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. 审查所有发现的敏感信息" >> $GITHUB_STEP_SUMMARY
          echo "2. 从代码中移除所有硬编码的密钥、令牌和密码" >> $GITHUB_STEP_SUMMARY
          echo "3. 使用GitHub Secrets或密钥管理服务存储敏感信息" >> $GITHUB_STEP_SUMMARY
          echo "4. 如果发现已泄露的密钥，立即轮换" >> $GITHUB_STEP_SUMMARY
          echo "5. 添加预提交钩子以防止未来泄露" >> $GITHUB_STEP_SUMMARY

      - name: Check overall status
        if: >-
          needs.trufflehog-scan.result != 'success' ||
          needs.gitleaks-scan.result != 'success'
        run: |
          echo "Secret扫描发现问题，请查看详细报告"
          exit 1
