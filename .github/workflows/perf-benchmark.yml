name: 性能基准测试与回归检测

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '*.txt'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  LNN_AUTH_ENABLED: 'false'

jobs:
  perf-benchmark:
    name: 全量性能基准测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 该 job 需要 issues: write 以便在检测到严重性能回归时创建 GitHub Issue
    permissions:
      contents: read
      issues: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f engineering/python/requirements.txt ]; then pip install -r engineering/python/requirements.txt; fi
          pip install pytest pytest-benchmark matplotlib
          pip install numpy

      - name: Run comprehensive benchmark suite
        env:
          CI: 'true'
          FAIL_ON_REGRESSION: 'true'
          BENCHMARK_DB_PATH: tests/benchmarks/benchmark_results.db
          BENCHMARK_HISTORY_DIR: tests/benchmarks/history
          BENCHMARK_OUTPUT_DIR: tests/benchmarks/reports
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}:${PWD}/python"
          python tests/benchmarks/run_all.py

      - name: Check for performance regressions
        id: regression
        env:
          BENCHMARK_DB_PATH: tests/benchmarks/benchmark_results.db
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}:${PWD}/python"
          python tests/benchmarks/check_regression.py latest --json > regression_check.json 2>&1 || true
          echo "Regression check result:"
          cat regression_check.json
          # 空库/上游无数据时上一行会把错误文本写进 regression_check.json，
          # 直接 json.load 会崩（2026-09-05 修复：无效 JSON 视为 NO_DATA 放行）
          STATUS=$(python -c "
          import json
          try:
              with open('regression_check.json') as f:
                  data = json.load(f)
          except (json.JSONDecodeError, ValueError):
              data = {}
          summary = data.get('summary', {})
          if not data:
              print('NO_DATA')
          elif summary.get('critical_regression_detected', False):
              print('CRITICAL')
          elif summary.get('critical', 0) > 0 or summary.get('warning', 0) > 0:
              print('WARNING')
          else:
              print('PASS')
          ")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue on critical regression
        if: steps.regression.outputs.status == 'CRITICAL'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 性能基准测试检测到严重回归\n\n';
            body += 'CI 运行 ID: ' + (process.env.GITHUB_RUN_ID || '') + '\n\n';
            try {
              const report = fs.readFileSync('regression_check.json', 'utf8');
              const parsed = JSON.parse(report);
              body += '| 指标 | 当前值 | 上次值 | 变化率 | 状态 |\n';
              body += '|------|--------|--------|--------|------|\n';
              if (parsed.entries) {
                for (const e of parsed.entries) {
                  if (e.status === 'CRITICAL') {
                    body += `| ${e.metric} | ${e.current} | ${e.previous} | ${e.change_pct}% | CRITICAL |\n`;
                  }
                }
              }
            } catch(e) {
              body += '详细信息请查看 CI 构建产物。\n';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Performance] 严重性能回退检测',
              body: body,
              labels: ['performance', 'regression', 'bug']
            });

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-benchmark-full-results
          path: |
            tests/benchmarks/reports/
            tests/benchmarks/history/
            tests/benchmarks/benchmark_results.db
            tests/benchmarks/reports/visualizations/
            regression_check.json
          retention-days: 60
