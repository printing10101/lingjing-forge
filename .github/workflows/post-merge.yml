name: 合并后流水线

on:
  push:
    branches:
      - main
      - master

# 安全修复：最小权限原则，默认仅授予只读权限
permissions:
  contents: read

env:
  # 代码已使用 3.11+ 特性（typing.NotRequired、enum.StrEnum），3.10 收集即崩；
  # 与 ci.yml 统一为 3.12（2026-09-05）
  PYTHON_VERSION: '3.12'
  # 2026-09-11 与 release/desktop-build 统一为 22：Node 18 已 EOL（2025-04）
  NODE_VERSION: '22'
  PIP_CACHE_DIR: ~/.cache/pip
  PNPM_CACHE_DIR: ~/.local/share/pnpm/store
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ github.repository }}
  STAGING_ENV: staging

concurrency:
  group: post-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================
  # Job 1: 构建项目
  # ============================================
  build:
    name: 构建项目
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_timestamp: ${{ steps.version.outputs.timestamp }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成版本号
        id: version
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "2.7.0")
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BUILD_VERSION="${VERSION}-staging.${TIMESTAMP}"
          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "构建版本: ${BUILD_VERSION}"

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 配置 pnpm
        # 版本取自根 package.json 的 packageManager 字段（pnpm@9.15.9，与
        # lockfileVersion 9.0 同代）
        uses: pnpm/action-setup@v4

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('engineering/python/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 缓存 pnpm 依赖
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_CACHE_DIR }}
          # 锁文件位于 engineering/（2026-09-05 修复：原 key 指向根目录不存在的
          # pnpm-lock.yaml，且安装/构建步骤缺 working-directory 导致 frozen-lockfile 必挂）
          key: ${{ runner.os }}-pnpm-${{ hashFiles('engineering/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 安装 Python 依赖
        working-directory: engineering/python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 安装前端依赖
        working-directory: engineering
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        working-directory: engineering
        run: |
          echo "=== 构建前端项目 ==="
          pnpm run build
          echo "✓ 前端构建完成"

      - name: 运行快速测试验证
        working-directory: engineering/python
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/unit/ -m unit --tb=short -q || exit 1
          echo "✓ 快速测试验证通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            python/
            requirements.txt
            Dockerfile
            docker-compose.yml
          retention-days: 1

  # ============================================
  # Job 2: 构建并推送 Docker 镜像
  # ============================================
  docker-build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build]
    # 安全修复：此 job 需要推送镜像到 Registry，覆盖默认只读权限
    # id-token: write 供 cosign keyless 签名获取 OIDC token（缺失时签名必失败）
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=raw,value=staging-${{ needs.build.outputs.version }}
            type=sha,prefix=staging-

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ needs.build.outputs.version }}
            BUILD_TIMESTAMP=${{ needs.build.outputs.build_timestamp }}
            # CI runner 在海外。docker.io 匿名拉取受共享 IP 限流，python:3.12-slim
            # 反复报 blob not found（2026-09-10 两次实测相隔数小时）；
            # mirror.gcr.io 是 Google 维护的 Docker Hub 只读镜像，CI 可靠。
            # 华为云 SWR 公共库没有 python:3.12-slim（2026-09-05 实测 not found）。
            # 国内本地构建保持 Dockerfile 默认的华为云源，无需改动。
            BASE_REGISTRY=mirror.gcr.io/library
            PIP_INDEX_URL=https://pypi.org/simple/

      # P2-DEV-2 修复：镜像签名 - 使用 Sigstore cosign 对推送的镜像进行签名，保证供应链完整性
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Sign images with cosign
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          # keyless 签名（使用 OIDC token，无需管理私钥）
          # 与 release.yml 保持一致：签名失败应阻断流水线以确保供应链完整性
          cosign sign --yes ${{ steps.meta.outputs.tags }} || {
            echo "::error::cosign 签名失败! 镜像未签名，供应链完整性无法保证。"
            exit 1
          }
        # 注释：如果 OIDC 权限未正确配置，签名必定失败，此时应修复权限而非静默跳过。

      - name: 镜像构建完成确认
        run: |
          echo "✓ Docker 镜像构建并推送成功"
          echo "镜像标签:"
          echo "${{ steps.meta.outputs.tags }}"

  # ============================================
  # Job 3: 部署到 Staging 环境
  # ============================================
  deploy-staging:
    name: 部署到 Staging 环境
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, docker-build]
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.staging_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查部署配置
        # P1 安全修复：GitHub Actions 不允许在 if 条件中直接引用 secrets.* 上下文，
        # `${{ secrets.XXX != '' }}` 在 if 中永远被当作空字符串处理，导致部署步骤永远跳过。
        # 参照 release.yml 的 check-secrets 模式：通过 env 将 secrets 暴露给 shell，
        # 再以 step outputs 形式供后续步骤的 if 使用。
        id: deploy-config
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
          SSH_HOST_STAGING: ${{ secrets.SSH_HOST_STAGING }}
        run: |
          if [ -n "$KUBE_CONFIG_STAGING" ]; then
            echo "has_kube_config=true" >> $GITHUB_OUTPUT
          else
            echo "has_kube_config=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$SSH_HOST_STAGING" ]; then
            echo "has_ssh_host=true" >> $GITHUB_OUTPUT
          else
            echo "has_ssh_host=false" >> $GITHUB_OUTPUT
          fi

          echo "部署模式判定完成:"
          echo "  KUBE_CONFIG_STAGING: ${{ steps.deploy-config.outputs.has_kube_config == 'true' && '已配置' || '未配置' }}"
          echo "  SSH_HOST_STAGING: ${{ steps.deploy-config.outputs.has_ssh_host == 'true' && '已配置' || '未配置' }}"

      - name: 配置 Kubernetes 上下文
        if: steps.deploy-config.outputs.has_kube_config == 'true'
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG_STAGING" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: 部署到 Kubernetes (Staging)
        if: steps.deploy-config.outputs.has_kube_config == 'true'
        id: deploy-k8s
        run: |
          echo "=== 部署到 Kubernetes Staging 环境 ==="

          # 更新部署配置
          cd deploy/k8s
          sed -i "s|image:.*|image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ needs.build.outputs.version }}|g" deployment.yml

          # 应用部署
          kubectl apply -f deployment.yml -n staging
          kubectl rollout status deployment/lnn-api -n staging --timeout=300s

          echo "✓ Kubernetes 部署完成"

      - name: 部署到云服务器 (Staging)
        if: steps.deploy-config.outputs.has_ssh_host == 'true' && steps.deploy-config.outputs.has_kube_config == 'false'
        id: deploy-vm
        env:
          SSH_KEY_STAGING: ${{ secrets.SSH_KEY_STAGING }}
          SSH_USER_STAGING: ${{ secrets.SSH_USER_STAGING }}
          SSH_HOST_STAGING: ${{ secrets.SSH_HOST_STAGING }}
        run: |
          echo "=== 部署到云服务器 Staging 环境 ==="

          # 配置 SSH
          mkdir -p ~/.ssh
          echo "$SSH_KEY_STAGING" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # P1 安全修复：StrictHostKeyChecking=no 关闭主机密钥校验，存在中间人攻击风险。
          # 改用 accept-new：首次连接自动接受并记录主机指纹，后续连接校验指纹一致性。
          # 生产环境强烈建议通过 SSH_KNOWN_HOSTS secret 注入已知主机指纹：
          #   echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          #   ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ...
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER_STAGING@$SSH_HOST_STAGING" << 'EOF'
            cd /opt/lingjing-staging
            docker-compose pull
            docker-compose up -d
            sleep 10
            docker-compose ps
          EOF

          echo "✓ 云服务器部署完成"

      - name: 设置 Staging URL
        id: deploy
        run: |
          STAGING_URL="${{ secrets.STAGING_URL || 'https://staging.lingjing.example.com' }}"
          echo "staging_url=${STAGING_URL}" >> $GITHUB_OUTPUT
          echo "Staging URL: ${STAGING_URL}"

      - name: 部署后健康检查
        run: |
          echo "=== 执行部署后健康检查 ==="
          STAGING_URL="${{ steps.deploy.outputs.staging_url }}"
          
          # 等待服务启动
          echo "等待服务启动..."
          sleep 30
          
          # 健康检查
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/health/ping" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ 健康检查通过 (HTTP ${HTTP_CODE})"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "健康检查重试 ${RETRY_COUNT}/${MAX_RETRIES} (HTTP ${HTTP_CODE})"
            sleep 10
          done
          
          echo " 健康检查失败"
          exit 1

  # ============================================
  # Job 4: 部署后验证测试
  # ============================================
  post-deploy-verification:
    name: 部署后验证测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-staging]
    environment:
      name: staging

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装测试依赖
        run: |
          pip install pytest requests pytest-html

      - name: 运行冒烟测试
        env:
          STAGING_URL: ${{ needs.deploy-staging.outputs.staging_url || secrets.STAGING_URL }}
        run: |
          echo "=== 运行冒烟测试 ==="
          
          # 创建简单的冒烟测试
          cat > smoke_test.py << 'EOF'
          import requests
          import os
          
          def test_health_endpoint():
              """测试健康检查端点"""
              url = os.getenv('STAGING_URL', 'https://staging.lingjing.example.com')
              response = requests.get(f'{url}/api/health/ping', timeout=10)
              assert response.status_code == 200
              data = response.json()
              assert data.get('status') == 'healthy'
          
          def test_api_version():
              """测试 API 版本端点"""
              url = os.getenv('STAGING_URL', 'https://staging.lingjing.example.com')
              response = requests.get(f'{url}/api/version', timeout=10)
              assert response.status_code == 200
          
          def test_cors_headers():
              """测试 CORS 头"""
              url = os.getenv('STAGING_URL', 'https://staging.lingjing.example.com')
              response = requests.options(f'{url}/api/health/ping', timeout=10)
              assert 'access-control-allow-origin' in response.headers
          EOF
          
          pytest smoke_test.py -v --html=smoke-test-report.html
          echo "✓ 冒烟测试通过"

      - name: 运行集成测试子集
        working-directory: engineering/python
        env:
          STAGING_URL: ${{ needs.deploy-staging.outputs.staging_url || secrets.STAGING_URL }}
        run: |
          echo "=== 运行关键集成测试 ==="
          pip install pytest pytest-asyncio httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
          # 运行标记为 critical 的集成测试
          # 安全修复：移除 `|| echo "..."` 吞错，让集成测试失败真正阻断流水线
          pytest tests/integration/ -m "integration and not slow" \
            --tb=short -q \
            --html=../integration-test-report.html

      - name: 上传验证测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-verification-reports
          path: |
            smoke-test-report.html
            integration-test-report.html
          retention-days: 7

  # ============================================
  # Job 5: 通知与汇总
  # ============================================
  notification:
    name: 部署通知与汇总
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, docker-build, deploy-staging, post-deploy-verification]
    if: always()

    steps:
      - name: 生成部署汇总
        run: |
          echo "## Staging 部署汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 任务 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建项目 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker 镜像构建 | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 部署到 Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 部署后验证 | ${{ needs.post-deploy-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "**构建版本**: ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.deploy-staging.result }}" = "success" ]; then
            echo "**Staging URL**: ${{ needs.deploy-staging.outputs.staging_url }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 部署成功通知
        if: needs.deploy-staging.result == 'success' && needs.post-deploy-verification.result == 'success'
        run: |
          echo " Staging 环境部署成功！"
          echo "版本: ${{ needs.build.outputs.version }}"
          echo "URL: ${{ needs.deploy-staging.outputs.staging_url }}"

      - name: 部署失败通知
        if: needs.deploy-staging.result != 'success' || needs.post-deploy-verification.result != 'success'
        run: |
          echo " Staging 环境部署失败！"
          echo "请检查日志以获取详细信息。"
          exit 1
