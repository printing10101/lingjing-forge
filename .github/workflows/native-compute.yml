name: Native compute contracts

on:
  pull_request:
    paths:
      - 'rust/compute/**'
      - 'engineering/python/app/simulation/**'
      - '.github/workflows/native-compute.yml'
  push:
    branches: [main]
    paths:
      - 'rust/compute/**'
      - 'engineering/python/app/simulation/**'
      - '.github/workflows/native-compute.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-compute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYO3_PYTHON: python
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native test dependencies
        run: python -m pip install "numpy>=2.1,<2.3"
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check Rust formatting
        run: cargo +stable fmt --manifest-path rust/compute/Cargo.toml --all -- --check
      - name: Test core geometry and cutting
        run: cargo +stable test --manifest-path rust/compute/Cargo.toml -p compute-core
      - name: Build the Python extension
        run: cargo +stable build --manifest-path rust/compute/Cargo.toml -p compute-pyo3-bindings
      - name: Test the actual Python and Rust boundary
        run: python rust/compute/tests/test_native_contract.py
