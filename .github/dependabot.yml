# Dependabot 配置文件
# 用于自动检测和更新依赖项中的安全漏洞
# 文档: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # npm/yarn/pnpm 依赖项配置
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    reviewers:
      - "security-team"
    assignees:
      - "security-bot"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
      - "npm"
    # 安全更新配置
    security-updates: true
    # 版本更新策略
    versioning-strategy: increase
    # 忽略特定依赖项（如有需要）
    # ignore:
    #   - dependency-name: "example-package"
    #     versions: [">= 2.0.0"]
    
  # Python pip 依赖项配置
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    reviewers:
      - "security-team"
    assignees:
      - "security-bot"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
      - "python"
    security-updates: true
    versioning-strategy: increase
    
  # Python 子目录依赖项配置
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    reviewers:
      - "security-team"
    assignees:
      - "security-bot"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
      - "python"
    security-updates: true
    versioning-strategy: increase
    
  # GitHub Actions 工作流配置
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "security-team"
    assignees:
      - "security-bot"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
      - "github-actions"
    security-updates: true
    
  # Docker 容器配置（如果存在Dockerfile）
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "security-team"
    assignees:
      - "security-bot"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
      - "docker"
    security-updates: true
