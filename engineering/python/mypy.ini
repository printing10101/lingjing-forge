[mypy]
# Baseline config (phase 5: type-safety cleanup).
# Goal: real type checking for first-party code while heavy third-party
# libraries are missing; warn_unused_ignores marks removable type:ignores.
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = False
disallow_untyped_defs = False
check_untyped_defs = True
show_error_codes = True
# 固定缓存目录（2026-08-18）：历史上曾出现 25.5GB 的 Temp/ 缓存
# （由 MYPY_CACHE_DIR/--cache-dir 指向 engineering/python/Temp 生成，
# 含 numpy 4.5GB/sqlalchemy 3.5GB 等第三方包分析缓存）。此处固定到
# .mypy_cache（已被 .gitignore 忽略），防止再次膨胀到仓库内。
cache_dir = .mypy_cache

# Heavy / stub-less third-party libs: skip silently (avoid baseline noise).
[mypy-torch.*]
ignore_missing_imports = True
[mypy-torchdiffeq.*]
ignore_missing_imports = True
[mypy-onnxruntime.*]
ignore_missing_imports = True
[mypy-chromadb.*]
ignore_missing_imports = True
[mypy-tdengine.*]
ignore_missing_imports = True
[mypy-redis.*]
ignore_missing_imports = True
[mypy-cadquery.*]
ignore_missing_imports = True
[mypy-pyodbc.*]
ignore_missing_imports = True
[mypy-matplotlib.*]
ignore_missing_imports = True
[mypy-numpy.*]
ignore_missing_imports = True
