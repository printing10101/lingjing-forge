[pytest]
# 测试收集策略（E-20）+ 阶段2 解耦改造：
# - 阶段2 物理分层后，工程侧测试目录为 ``engineering/python/tests``。
# - ``engineering/python/app/**/tests/`` 下的内嵌测试为**模块自测**，用于开发时
#   快速验证模块内部功能，不进入默认 CI 收集（避免拖慢 CI / 触发环境依赖如
#   torch/opcua）。
# - 如需运行模块自测，显式指定路径：
#   ``pytest engineering/python/app/ai/lnn/tests/``。
# - 新增模块自测应评估是否上提到 ``engineering/python/tests/`` 以纳入 CI；
#   若保留在模块内，需确保使用绝对导入（``from app.xxx import yyy``），
#   路径推算冗余但不会出错（根 conftest 已将 engineering/python/ 加入 sys.path）。
# - 科研侧测试（research/tests/）独立环境运行，不纳入工程侧 CI 收集。
#   运行方式：``cd research && pytest tests/``（需先安装 research/requirements.txt）。
testpaths = engineering/python/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 阶段2 解耦改造：sys.path 注入由 ``engineering/python/conftest.py`` 完成。
# 背景：``plugins.data_flywheel`` 包位于 engineering/python/plugins/，
# 但 ``pytest.ini`` 的 rootdir 是项目根，注入必须早于对 ``engineering/python/tests/**``
# 的 collect，否则 ``from plugins.data_flywheel.xxx import ...`` 会 ModuleNotFoundError。
# 机制：``engineering/python/conftest.py`` 是 testpaths 子树的祖先目录 conftest，
# pytest 在收集该子树前会先导入它，其顶层 sys.path 注入因此生效。
# 解决方案：项目根 ``conftest.py`` 在 pytest 启动时最先被加载，注入 sys.path，
# 确保在所有 collect 操作之前 ``engineering/python/`` 已在 sys.path 上。

# 防复发机制 [E-P0-3]：显式排除 app/**/tests/ 内嵌测试目录
# 根因：pytest 9.x 在跨目录调用时，testpaths 解析不一致，会把 cwd 作为收集根
# 递归扫描 engineering/python/app/，进入 app/ai/lnn/tests/test_gpu_training.py，
# 该文件顶层 import torch → pandas → pyarrow.compute 触发 STATUS_HEAP_CORRUPTION。
# 双重防护：
#   1. pytest.ini 的 norecursedirs（本行下方）—— ini 级别有效配置
#   2. engineering/python/conftest.py 的 collect_ignore = ["app"] —— Python 级别变量
# 注意：collect_ignore 是 conftest.py 专属 Python 变量，写入 pytest.ini 会触发
# PytestConfigWarning: Unknown config option: collect_ignore，因此此处仅保留
# norecursedirs，conftest.py 中保留 collect_ignore。
# 阶段2 解耦新增：排除 research/ 与 shared/ 目录，避免工程侧 pytest 误扫科研侧
# 测试（torch 依赖）与契约层（无测试）。
norecursedirs = .git .venv venv node_modules app research shared desktop_runtime
# 覆盖率说明（2026-09-05）：覆盖率不在全局 addopts 启用，由 CI 在需要门禁的
# job 中显式传 --cov 参数（ci.yml/pr.yml 的 unit job，--cov-config 指向根
# .coveragerc，fail_under=24）。原因：全局强制插桩使本地单文件运行从秒级
# 拖到分钟级，且局部运行必然触发 fail_under 假警报。本地如需复现覆盖率：
#   pytest --cov=engineering/python/app --cov-config=.coveragerc
addopts =
    --strict-markers
    --tb=short
    -v
    --durations=10
    --import-mode=importlib
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multi-module, slower)
    regression: Regression tests (baseline comparison)
    slow: Tests that take longer than 5 seconds
    postprocessor: Tests for CNC postprocessor modules
    geometry: Tests for geometric operations
    lnn: Tests for LNN AI modules
    api: Tests for API endpoints
    database: Tests for database operations
    gcode: Tests for G-code generation and validation
    benchmark: Model precision benchmark tests (optional in CI)
    skip_ci: Tests that should be skipped in CI (require local resources)
    ijepa: Tests for I-JEPA 3D geometry extraction module
    scenario1: Integration tests for 3-view to NC code conversion
    scenario2: Integration tests for real-time machining monitoring
    scenario3: Integration tests for process planning consultation
    e2e: End-to-end full pipeline tests
    fault_recovery: Fault injection and recovery tests
    resource: Resource usage monitoring tests
    contracts: Core architecture contract tests (Task/Dataset/Plugin/Config/Observability)
    plugins: Tests for business plugins (data_flywheel, etc.)
    machining: Tests for end-to-end machining pipeline
    safety: Tests for safety-critical modules and sandbox security
    controller: Tests for CNC controller communication modules
    collision: Tests for collision detection and avoidance modules
    wear: Tests for tool wear prediction modules
